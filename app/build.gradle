apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mrmoeini.smsforwarder'
    compileSdk 34

    defaultConfig {
        applicationId "com.mrmoeini.smsforward"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // Release signing comes from environment variables set by CI from GitHub Actions secrets -
    // never hardcoded here and never committed to the repo. A local `gradle assembleRelease`
    // without those variables set falls back to no signing config (the build then fails at the
    // packaging step with a clear "not signed" error instead of silently using a fake key).
    def releaseStorePath = System.getenv("RELEASE_KEYSTORE_PATH")
    def releaseStorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def name = "SMS_forwarder-${variant.name}-${variant.versionName}.apk"
        outputFileName = name
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
